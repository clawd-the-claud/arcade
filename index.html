<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARCADE — procedural games</title>
<meta name="description" content="A small cabinet of procedural browser games. No engines, no asset packs — everything generated in code." />
<style>
  :root{
    --bg:      #04060d;
    --ink:     #e2f0ff;
    --dim:     rgba(196,224,255,.46);
    --dimmer:  rgba(196,224,255,.22);
    --line:    rgba(150,200,255,.14);
    --aur:     #6bffc4;
    --aur2:    #7ad4ff;
    --vio:     #c58bff;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    min-height:100%; background:var(--bg); color:var(--ink);
    font-family: ui-sans-serif, -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }

  /* ---- the drifting aurora behind everything -------------------------
     Drawn into a tiny canvas and scaled up by CSS. Upscaling a 160x90
     buffer is essentially free and gives smoother falloff than any blur
     filter would.                                                        */
  #bg{
    position:fixed; inset:0; width:100%; height:100%;
    z-index:0; opacity:.55; filter:saturate(1.25);
    pointer-events:none;
  }
  #vign{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse at 50% 0%, transparent 0%, rgba(4,6,13,.55) 55%, rgba(4,6,13,.92) 100%);
  }
  #grain{
    position:fixed; inset:0; z-index:2; pointer-events:none; opacity:.035;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  }

  .wrap{ position:relative; z-index:3; max-width:1180px; margin:0 auto; padding:0 28px 96px; }

  /* ---------------------------------------------------------- header */
  header{ padding:118px 0 0; text-align:center; }
  .kicker{
    font-size:10px; letter-spacing:.5em; text-transform:uppercase;
    color:var(--dim); margin-bottom:30px;
  }
  h1{
    font-size:clamp(52px,12vw,132px); font-weight:200;
    letter-spacing:.26em; text-indent:.26em; line-height:1;
    background:linear-gradient(180deg,#fff 0%, var(--aur) 44%, var(--aur2) 70%, var(--vio) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 44px rgba(107,255,196,.30));
    animation:breathe 7s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ filter:drop-shadow(0 0 34px rgba(107,255,196,.24)); }
    50%    { filter:drop-shadow(0 0 62px rgba(122,212,255,.44)); }
  }
  .rule{
    width:min(520px,66vw); height:1px; margin:34px auto 24px;
    background:linear-gradient(90deg,transparent,var(--line),transparent);
  }
  .blurb{
    font-size:14.5px; line-height:1.75; color:var(--dim);
    max-width:560px; margin:0 auto; font-weight:300;
  }
  .blurb b{ color:rgba(226,240,255,.82); font-weight:400; }

  /* ----------------------------------------------------------- grid */
  .shelf{
    margin-top:82px; display:grid; gap:26px;
    grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
  }

  .card{
    position:relative; border:1px solid var(--line); border-radius:16px;
    background:linear-gradient(180deg, rgba(140,200,255,.055), rgba(140,200,255,.015));
    overflow:hidden; cursor:pointer; text-align:left;
    transition:transform .45s cubic-bezier(.2,.8,.3,1), border-color .45s ease, box-shadow .45s ease;
    color:inherit; font:inherit; display:block; width:100%;
  }
  .card:hover, .card:focus-visible{
    transform:translateY(-6px);
    border-color:rgba(180,225,255,.4);
    box-shadow:0 22px 60px -22px var(--glow, rgba(107,255,196,.5));
    outline:none;
  }
  .card canvas{ display:block; width:100%; height:178px; background:#05070f; }
  .card .body{ padding:20px 22px 24px; }
  .card h2{
    font-size:19px; font-weight:300; letter-spacing:.19em; text-transform:uppercase;
  }
  .card .tag{ font-size:12.5px; color:var(--dim); margin-top:7px; font-weight:300; letter-spacing:.03em; }
  .card .desc{ font-size:13px; line-height:1.65; color:rgba(196,224,255,.62); margin-top:14px; font-weight:300; }
  .chips{ margin-top:16px; display:flex; flex-wrap:wrap; gap:7px; }
  .chip{
    font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
    padding:5px 9px; border:1px solid var(--line); border-radius:99px;
    color:var(--dim);
  }
  .cardfoot{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:20px; padding-top:16px; border-top:1px solid var(--line);
  }
  .play{
    font-size:10.5px; letter-spacing:.34em; text-transform:uppercase;
    color:var(--ink); display:flex; align-items:center; gap:9px;
  }
  .play .dot{
    width:6px; height:6px; border-radius:99px; background:var(--glow,var(--aur));
    box-shadow:0 0 12px var(--glow,var(--aur));
  }
  .src{
    font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--dimmer);
    padding:4px; border-radius:6px; transition:color .3s ease;
  }
  .src:hover{ color:var(--ink); }

  /* soon-to-come slot */
  .card.soon{ cursor:default; opacity:.5; }
  .card.soon:hover{ transform:none; border-color:var(--line); box-shadow:none; }
  .soonbox{
    height:178px; display:flex; align-items:center; justify-content:center;
    border-bottom:1px solid var(--line);
    font-size:10px; letter-spacing:.42em; text-transform:uppercase; color:var(--dimmer);
  }

  /* --------------------------------------------------------- player */
  #player{
    position:fixed; inset:0; z-index:60; background:#000;
    display:none; opacity:0; transition:opacity .45s ease;
  }
  #player.on{ display:block; }
  #player.vis{ opacity:1; }
  #player iframe{ width:100%; height:100%; border:0; display:block; }
  #bar{
    position:absolute; top:0; left:0; right:0; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 22px; gap:16px;
    background:linear-gradient(180deg, rgba(4,6,13,.86), transparent);
    opacity:0; transition:opacity .35s ease; pointer-events:none;
  }
  #player:hover #bar, #bar.show{ opacity:1; pointer-events:auto; }
  #bar .now{ font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--dim); }
  #bar .now b{ color:var(--ink); font-weight:400; }
  .btn{
    font:inherit; font-size:10px; letter-spacing:.26em; text-transform:uppercase;
    color:var(--ink); background:rgba(140,200,255,.08); cursor:pointer;
    border:1px solid rgba(180,225,255,.24); border-radius:99px; padding:9px 17px;
    transition:background .3s ease, border-color .3s ease;
  }
  .btn:hover{ background:rgba(140,220,255,.2); border-color:rgba(190,230,255,.55); }
  .btnrow{ display:flex; gap:10px; }

  /* ---------------------------------------------------------- foot */
  footer{
    margin-top:96px; padding-top:34px; border-top:1px solid var(--line);
    display:flex; flex-wrap:wrap; gap:14px 26px; align-items:center; justify-content:space-between;
    font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--dimmer);
  }
  footer a{ color:var(--dim); text-decoration:none; transition:color .3s ease; }
  footer a:hover{ color:var(--ink); }

  @media (max-width:560px){
    header{ padding-top:76px; }
    .shelf{ grid-template-columns:1fr; }
    .wrap{ padding:0 18px 64px; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div id="vign" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <div class="kicker">Made by a machine, on purpose</div>
    <h1>ARCADE</h1>
    <div class="rule"></div>
    <p class="blurb">
      A small cabinet of browser games with <b>no asset packs and no engines</b>.
      Every texture, mesh, and note is generated in code at run time.
      Pick one. It loads in a tab.
    </p>
  </header>

  <main class="shelf" id="shelf" aria-label="Games"></main>

  <footer>
    <div>Arcade · <span id="count">—</span> cabinets</div>
    <div><a href="https://github.com/clawd-the-claud/arcade" target="_blank" rel="noopener">Source on GitHub</a></div>
  </footer>
</div>

<div id="player" aria-hidden="true">
  <div id="bar">
    <div class="now">Now playing · <b id="nowTitle"></b></div>
    <div class="btnrow">
      <button class="btn" id="fsBtn">Fullscreen</button>
      <button class="btn" id="exitBtn">Exit · Esc</button>
    </div>
  </div>
  <iframe id="frame" title="Game" allow="autoplay; fullscreen; gamepad; xr-spatial-tracking"></iframe>
</div>

<!-- The ?v= is a cache buster. GitHub Pages serves modules with a long
     max-age, so without it an edited src/ file keeps running its old version
     in browsers that have already visited. Bump it when you change src/.
     games.json is fetched no-cache, so adding a GAME never needs a bump. -->
<script type="module" src="./src/app.js?v=2"></script>
</body>
</html>
